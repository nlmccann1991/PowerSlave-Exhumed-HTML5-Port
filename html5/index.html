<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PowerSlave Exhumed HTML5</title>
<style>
  :root { --bg: #0b0806; --fg: #f1e3c4; --accent: #e0a63b; --muted: #9c8f7a; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden;
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; image-rendering: pixelated; }
  #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px;
    background: radial-gradient(ellipse at center, #2a1b0e 0%, #0b0806 70%); z-index: 5; }
  #boot .card { max-width: 560px; width: 100%; text-align: center; }
  #boot h1 { font-size: 28px; letter-spacing: 3px; margin: 0 0 4px; color: var(--accent); text-transform: uppercase; }
  #boot p { color: var(--muted); margin: 8px 0; }
  #boot .bar { height: 6px; background: #2b2118; border-radius: 3px; overflow: hidden; margin: 18px 0 8px; }
  #boot .bar div { height: 100%; width: 0; background: var(--accent); transition: width .15s; }
  #boot button, #boot label.btn { display: inline-block; margin: 10px 6px 0; padding: 10px 18px; border-radius: 6px;
    border: 1px solid var(--accent); background: #3a2610; color: var(--fg); font: inherit; cursor: pointer; }
  #boot button:hover, #boot label.btn:hover { background: #5a3a14; }
  #boot input[type=file] { display: none; }
  #boot .err { color: #ff8a7a; white-space: pre-wrap; }
  #boot.hidden { display: none; }
  #hint { position: fixed; bottom: 10px; left: 0; right: 0; text-align: center; color: var(--muted); font-size: 12px;
    pointer-events: none; z-index: 3; }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<div id="hint"></div>
<div id="boot">
  <div class="card">
    <h1>PowerSlave Exhumed</h1>
    <p>Browser port. Uses the game data from your own copy of PowerSlave Exhumed.</p>
    <div class="bar"><div id="bar"></div></div>
    <p id="status">Looking for game data…</p>
    <p class="err" id="err"></p>
    <div id="pick" style="display:none">
      <p>Select your <b>PowerSlave Exhumed</b> install folder (the one with <code>PowerslaveEX.kpf</code>).</p>
      <label class="btn">Choose game folder<input id="folder" type="file" webkitdirectory directory multiple></label>
      <label class="btn">Choose PowerslaveEX.kpf only<input id="kpffile" type="file" accept=".kpf"></label>
    </div>
  </div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
